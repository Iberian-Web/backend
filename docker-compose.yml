services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mydb
    # Por defecto Postgres admite 100 conexiones a la vez. Todo lo que abra
    # el backend (WEB_CONCURRENCY workers × DB_POOL_SIZE cada uno) tiene que
    # caber ahí con margen para herramientas externas (psql, migraciones...).
    # Súbelo si hace falta, p. ej. a 200:
    # command: postgres -c max_connections=200
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    image: backend
    container_name: backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/mydb?schema=public
      PORT: 3001
      NODE_ENV: production
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Dominios exactos (con https://) de tus frontends en Cloudflare Pages
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      # Nº de procesos trabajadores (1 por núcleo si se omite). Súbelo con
      # cuidado: cada worker abre su propio pool de Postgres (DB_POOL_SIZE),
      # así que WEB_CONCURRENCY × DB_POOL_SIZE no puede superar el
      # max_connections configurado en Postgres.
      # WEB_CONCURRENCY: 4
      # DB_POOL_SIZE: 20
    ports:
      - "3001:3001"
    # Límite de ficheros abiertos del propio contenedor: cada conexión SSE
    # (mapa de mesas, cocina, gestión de pedidos) consume una. El valor por
    # defecto de Docker/el host suele rondar 1024, insuficiente para miles
    # de conexiones simultáneas.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  postgres_data:
